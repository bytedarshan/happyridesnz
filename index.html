<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO -->
    <title>Happy Rides - Premium New Zealand Transfers & Tours</title>
    <meta name="description" content="Happy Rides offers premium airport transfers, city tours, and intercity travel across New Zealand. Professional drivers, luxury fleet, 24/7 service. Book online today." />
    <meta name="keywords" content="New Zealand tours, Auckland airport transfer, Rotorua day trip, Hobbiton tour, Paihia tour, NZ transfer, Happy Rides NZ" />
    <meta name="author" content="Happy Rides NZ" />
    <meta name="robots" content="index, follow" />

    <!-- Security Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#f0f4f8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Happy Rides" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://happyrides.co.nz/" />
    <meta property="og:title" content="Happy Rides - Premium New Zealand Transfers & Tours" />
    <meta property="og:description" content="Premium airport transfers, city tours, and intercity travel across New Zealand. Professional drivers, luxury fleet, 24/7 service." />
    <meta property="og:image" content="https://res.cloudinary.com/dni1i56yo/image/upload/v1779792499/happyrides/logo.png" />
    <meta property="og:locale" content="en_NZ" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Happy Rides - Premium New Zealand Transfers & Tours" />
    <meta name="twitter:description" content="Premium airport transfers, city tours, and intercity travel across New Zealand." />
    <meta name="twitter:image" content="https://res.cloudinary.com/dni1i56yo/image/upload/v1779792499/happyrides/logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Vendor iframe resizer — loaded once globally so BookingIframe.jsx
         can call window.iFrameResize() after the iframe mounts.
         defer keeps it non-blocking for the rest of the page. -->
    <script defer src="https://6a38cc049dc85.trial.easytaxioffice.com/assets/plugins/iframe-resizer/iframeResizer.min.js"></script>
  </body>
</html>
